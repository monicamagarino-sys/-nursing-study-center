<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambiar contraseña · Nursing Study Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172033;background:#f3f5fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(100%,460px);background:#fff;border-radius:28px;padding:30px;box-shadow:0 18px 55px #31386b22}
.badge{display:inline-block;background:#ecebff;color:#5753dc;font-weight:800;border-radius:999px;padding:8px 12px}
h1{font-size:30px;margin:18px 0 8px}.muted{color:#667085;line-height:1.45}
label{display:block;font-weight:750;margin:18px 0 7px}input{width:100%;font-size:18px;padding:15px;border:2px solid #d9ddeb;border-radius:14px}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#5753dc,#8656ee);color:#fff;font-size:17px;font-weight:800}
button:disabled{opacity:.55}.msg{margin-top:16px;padding:12px;border-radius:12px;display:none}.ok{display:block;background:#e9fbf2;color:#087a49}.err{display:block;background:#fff0f0;color:#a32323}
a{color:#5753dc;font-weight:750}
</style>
</head>
<body>
<main class="card">
<span class="badge">🔐 Monica Nursing Study Center</span>
<h1 id="title">Crear contraseña nueva</h1>
<p class="muted" id="intro">Escribe una contraseña nueva de 8 caracteres o más.</p>
<form id="form">
<label for="password">Contraseña nueva</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">Confirmar contraseña</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button id="save" type="submit">Guardar contraseña</button>
</form>
<div id="msg" class="msg" role="status"></div>
</main>
<script>
const sb=window.supabase.createClient('https://rqcofwzkyfsuxaxazqjx.supabase.co','sb_publishable_oDsA6a1L6dmP1FFUTAp_vw_vFW1HU9F',{auth:{persistSession:true,detectSessionInUrl:true}});
const form=document.getElementById('form'),msg=document.getElementById('msg'),save=document.getElementById('save');
function show(text,ok=false){msg.textContent=text;msg.className='msg '+(ok?'ok':'err')}
form.addEventListener('submit',async e=>{
 e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 if(password.length<8)return show('La contraseña debe tener al menos 8 caracteres.');
 if(password!==confirm)return show('Las contraseñas no coinciden.');
 save.disabled=true;save.textContent='Guardando…';
 const {error}=await sb.auth.updateUser({password});
 if(error){show('No se pudo cambiar: '+error.message);save.disabled=false;save.textContent='Guardar contraseña';return}
 show('Contraseña actualizada. Ya puedes regresar a la app e iniciar sesión.',true);
 form.style.display='none';
 const a=document.createElement('p');a.innerHTML='<a href="./">Volver a Nursing Study Center</a>';msg.after(a);
});
(async()=>{const {data}=await sb.auth.getSession();if(!data.session)show('Este enlace no es válido o venció. Solicita un enlace nuevo.');})();
</script>
</body>
</html>
